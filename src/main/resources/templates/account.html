<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PriyaMart | My Account</title><link rel="stylesheet" href="/style.css"></head><body class="soft-bg"><nav class="nav"><a class="brand" href="/products"><span class="logo">P</span> PriyaMart</a><div class="navlinks"><a href="/products">Shop</a><a href="/dashboard">Dashboard</a><a href="/cart">🛒 Cart</a><a class="active" href="/account">Profile</a><a href="/logout">Logout</a></div></nav><main class="account-page"><div class="page-title"><span class="eyebrow">MY ACCOUNT</span><h1>Your profile</h1><p>Customer information and order history.</p></div><div class="account-grid"><section class="profile-card"><div class="avatar large" th:text="${#strings.substring(user.name,0,1).toUpperCase()}"></div><h2 th:text="${user.name}"></h2><p th:text="${user.email}"></p><span class="role-chip">CUSTOMER</span><a class="cta full" href="/products">Shop now →</a></section><section class="panel"><div class="panel-title"><div><span class="eyebrow">PURCHASES</span><h2>Your orders</h2></div><span class="muted" th:text="${#lists.size(orders)} + ' total'"></span></div><div th:if="${#lists.isEmpty(orders)}" class="empty small"><div>🧾</div><h3>No purchases yet</h3><p>Start shopping to see your order history.</p></div><div class="order-list" th:unless="${#lists.isEmpty(orders)}"><div class="order-row" th:each="o:${orders}"><div><b th:text="'#PM-' + ${o.id}"></b><small th:text="${#temporals.format(o.createdAt,'dd MMM yyyy')}"></small></div><span class="status-chip" th:text="${o.status}"></span><strong>₹<span th:text="${#numbers.formatDecimal(o.total,1,2)}"></span></strong></div></div></section></div></main></body></html>
