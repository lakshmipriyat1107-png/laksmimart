<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PriyaMart | Cart</title><link rel="stylesheet" href="/style.css"></head><body class="soft-bg"><nav class="nav"><a class="brand" href="/products"><span class="logo">P</span> PriyaMart</a><div class="navlinks"><a href="/products">Shop</a><a href="/dashboard">Dashboard</a><a class="active" href="/cart">🛒 Cart</a><a href="/logout">Logout</a></div></nav><main class="cart-page"><div class="page-title"><span class="eyebrow">SHOPPING CART</span><h1>Your bag</h1><p>Review your items before placing the order.</p></div><div th:if="${#lists.isEmpty(cart)}" class="empty panel"><div>🛒</div><h2>Your cart is empty</h2><p>Add products from the store to get started.</p><a class="cta" href="/products">Browse products</a></div><div class="cart-layout" th:unless="${#lists.isEmpty(cart)}"><section class="panel cart-panel"><div class="panel-title"><h2>Cart items</h2><span class="muted" th:text="${#lists.size(cart)} + ' item(s)'"></span></div><div class="cart-item" th:each="i:${cart}"><img th:src="${i.product.imageUrl}" th:alt="${i.product.name}"><div class="cart-info"><span class="category-badge static" th:text="${i.product.category}"></span><h3 th:text="${i.product.name}"></h3><p th:text="${i.product.description}"></p><b>₹<span th:text="${#numbers.formatDecimal(i.product.price,1,2)}"></span></b></div><form class="qty-form" method="post" action="/cart/update"><input type="hidden" name="id" th:value="${i.product.id}"><input name="q" type="number" min="1" th:max="${i.product.stock}" th:value="${i.quantity}"><button>Update</button></form><div class="line-total">₹<span th:text="${#numbers.formatDecimal(i.total,1,2)}"></span><form method="post" action="/cart/remove"><input type="hidden" name="id" th:value="${i.product.id}"><button class="text-btn">Remove</button></form></div></div></section><aside class="summary"><span class="eyebrow">SUMMARY</span><h2>Order total</h2><div><span>Subtotal</span><b>₹<span th:text="${#numbers.formatDecimal(total,1,2)}"></span></b></div><div><span>Delivery</span><b>FREE</b></div><div><span>Taxes</span><span>Included</span></div><hr><div class="grand"><span>Total</span><b>₹<span th:text="${#numbers.formatDecimal(total,1,2)}"></span></b></div><form method="post" action="/checkout"><label>Delivery address</label><textarea name="address" placeholder="House / street / city / PIN code" required></textarea><button class="cta full">Place order →</button></form></aside></div></main></body></html>
