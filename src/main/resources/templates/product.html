<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${product.name} + ' | PriyaMart'"></title><link rel="stylesheet" href="/style.css"></head><body class="soft-bg"><nav class="nav"><a class="brand" href="/products"><span class="logo">P</span> PriyaMart</a><div class="navlinks"><a href="/products">Shop</a><a href="/dashboard">Dashboard</a><a href="/cart">🛒 Cart</a><a href="/logout">Logout</a></div></nav><main class="detail"><a class="back" href="/products">← Back to shopping</a><div class="detail-card"><div class="detail-image"><img th:src="${product.imageUrl}" th:alt="${product.name}"></div><div class="detail-info"><span class="category-badge static" th:text="${product.category}"></span><span class="eyebrow">PRODUCT DETAILS</span><h1 th:text="${product.name}"></h1><div class="rating big">★★★★★ <span>4.8 customer rating</span></div><p th:text="${product.description}"></p><div class="feature-list"><span>✓ Quality checked</span><span>✓ Secure packaging</span><span>✓ Easy returns</span></div><div class="detail-price">₹<span th:text="${#numbers.formatDecimal(product.price,1,2)}"></span></div><p class="stock-text" th:text="${product.stock > 0 ? '● ' + product.stock + ' available' : '● Currently unavailable'}"></p><form class="buy-form" method="post" action="/cart/add"><input type="hidden" name="id" th:value="${product.id}"><label>Quantity <input class="qty" name="q" type="number" min="1" th:max="${product.stock}" value="1"></label><button class="cta" th:disabled="${product.stock <= 0}">Add to cart →</button></form></div></div></main></body></html>
