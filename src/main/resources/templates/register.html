<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PriyaMart | Create Account</title><link rel="stylesheet" href="/style.css"></head><body class="auth-bg"><div class="auth-shell"><div class="auth-visual"><span class="logo">P</span><span class="eyebrow">JOIN PRIYAMART</span><h2>Make shopping<br><em>feel simple.</em></h2><p>Create a customer account to save your shopping journey and view order history.</p><div class="mini-features"><span>👤 Personal profile</span><span>🛒 Fast checkout</span><span>📦 Order history</span></div></div><div class="auth-box"><div class="auth-brand"><span class="logo">P</span><b>PriyaMart</b></div><span class="eyebrow">NEW CUSTOMER</span><h1>Create account</h1><p class="muted">It takes less than a minute to get started.</p><p class="error" th:if="${error}" th:text="${error}"></p><form method="post" action="/register"><label>Full name</label><input name="name" placeholder="Your name" required><label>Email</label><input name="email" type="email" placeholder="you@example.com" required><label>Password</label><input name="password" type="password" placeholder="Create a password" required><button class="cta full">Create customer account →</button></form><p class="switch">Already registered? <a href="/login">Sign in</a></p></div></div></body></html>
