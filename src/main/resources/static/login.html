<!DOCTYPE html>
<html>
<head>
    <title>PriyaMart - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 400px;
            background: #1e293b;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .logo {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #334155;
            color: white;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            outline: 2px solid #3b82f6;
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 12px;
            background: none;
            border: none;
            color: #60a5fa;
            cursor: pointer;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: #7f1d1d;
            color: #fecaca;
            padding: 10px;
            border-radius: 7px;
            margin-top: 15px;
            display: none;
            text-align: center;
        }

        .register {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
        }

        .register a {
            color: #60a5fa;
            text-decoration: none;
        }

        .back-home {
            text-align: center;
            margin-top: 20px;
        }

        .back-home a {
            color: #94a3b8;
            text-decoration: none;
        }

        .back-home a:hover,
        .register a:hover {
            color: white;
        }

        @media (max-width: 500px) {
            .login-container {
                width: 90%;
                padding: 25px;
            }
        }
    .product-image{width:100%;max-width:280px;height:190px;object-fit:cover;border-radius:16px;display:block;margin:0 auto 14px;}
</style>
</head>

<body>

<div class="login-container">

    

    <p class="subtitle">
        Welcome back! Please login to continue.
    </p>


    <form id="loginForm">

        <!-- Email -->
        <label>Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >


        <!-- Password -->
        <label>Password</label>

        <div class="password-box">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
            >

            <button
                type="button"
                class="show-password"
                onclick="togglePassword()">
                Show
            </button>

        </div>


        <!-- Role -->
        <label>Select Role</label>

        <select id="role">

            <option value="Buyer">
                🛒 Buyer
            </option>

            <option value="Seller">
                📦 Seller
            </option>

            <option value="Admin">
                👨‍💼 Admin
            </option>

        </select>


        <!-- Error Message -->
        <div class="error" id="errorMessage">
            Please enter email and password.
        </div>


        <!-- Login -->
        <button
            type="submit"
            class="login-btn"
            id="loginBtn">

            Login

        </button>

    </form>


    <!-- Register -->
    <div class="register">

        New User?

        <a href="register.html">
            Create an Account
        </a>

    </div>


    <!-- Home -->
    <div class="back-home">

        <a href="index.html">
            ← Back to Home
        </a>

    </div>

</div>


<script>

    // Show / Hide Password
    function togglePassword() {

        const password =
            document.getElementById("password");

        const button =
            document.querySelector(".show-password");

        if (password.type === "password") {

            password.type = "text";
            button.innerText = "Hide";

        } else {

            password.type = "password";
            button.innerText = "Show";
        }
    }


    // Login Validation
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const role = document.getElementById("role").value;
    const errorMessage = document.getElementById("errorMessage");
    const loginBtn = document.getElementById("loginBtn");

    if (email === "" || password === "") {
        errorMessage.innerText = "Please enter your email and password.";
        errorMessage.style.display = "block"; return;
    }
    if (!email.includes("@")) {
        errorMessage.innerText = "Please enter a valid email address.";
        errorMessage.style.display = "block"; return;
    }
    errorMessage.style.display = "none";
    loginBtn.innerText = "Logging in...";
    loginBtn.disabled = true;

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST", headers: {"Content-Type": "application/json"},
            body: JSON.stringify({email, password, role})
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.message || "Invalid login details.");
        sessionStorage.setItem("priyamartUser", JSON.stringify(result.user));
        if (result.user.role === "ADMIN") window.location.href = "/admin.html";
        else if (result.user.role === "SELLER") window.location.href = "/seller.html";
        else window.location.href = "/buyer.html";
    } catch (error) {
        errorMessage.innerText = error.message;
        errorMessage.style.display = "block";
        loginBtn.innerText = "Login"; loginBtn.disabled = false;
    }
});
</script>

</body>
</html>
